default_permissions = "pullops_github"

[shell_environment_policy]
ignore_default_excludes = true
include_only = ["PATH", "HOME", "PULLOPS_GITHUB_TOKEN", "GITHUB_TOKEN", "GH_TOKEN"]

[permissions.pullops_github]
description = "Workspace write with GitHub-only network access."
extends = ":workspace"

[permissions.pullops_github.filesystem.":workspace_roots"]
".git" = "write"

[permissions.pullops_github.network]
enabled = true

[permissions.pullops_github.network.domains]
"**.github.com" = "allow"
